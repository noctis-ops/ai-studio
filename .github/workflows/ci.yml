name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up FFmpeg
        # FedericoCarboni/setup-ffmpeg@v3 (pinned to the v3 tag commit)
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev,providers]

      - name: Check ffmpeg capabilities (D3)
        run: python scripts/check_ffmpeg.py

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy

      - name: Tests (with coverage gate)
        run: >-
          python -m pytest tests/ -q -m "not slow"
          --cov=studio.core --cov=studio.db --cov=studio.pipeline
          --cov=studio.audio --cov=studio.providers.tts
          --cov=studio.qc --cov=studio.video --cov=studio.media --cov=studio.providers
          --cov-report=term-missing --cov-fail-under=90
