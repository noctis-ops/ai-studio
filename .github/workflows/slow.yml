name: Slow tests

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays at 03:17 UTC. T-MIX-05 is a ~20 minute scale test and
    # is deliberately excluded from the default CI matrix.
    - cron: "17 3 * * 1"

jobs:
  slow:
    name: Slow integration (Linux / Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev,providers]
      - name: Check ffmpeg capabilities
        run: python scripts/check_ffmpeg.py
      - name: Slow tests
        run: python -m pytest tests/ -q -m slow
