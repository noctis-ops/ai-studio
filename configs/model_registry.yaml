      fixed_params: {}
      result_map: {asset_url: "video.url", seed: "seed", nsfw_flags: "has_nsfw_concepts"}
      input_transport: data_uri
      prompt_templates: {ref_clause: "The character {name} must look exactly like the character in reference image {n}."}
