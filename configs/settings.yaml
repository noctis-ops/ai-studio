paths: {home: "${STUDIO_HOME}", db: data/studio.db, cas: data/cas, exports: data/exports, projects: data/projects}

# ---- Language / aspect switches (CRITICAL) ----
# Defaults for new episodes; can be overridden per episode. Stages must iterate these, never hardcode.
languages: ["ar"]            # allowed values: ar, en. Launch config is Arabic-only.
aspects: ["9:16"]            # allowed values: 9:16, 16:9. First benchmark is a single-aspect Short.
default_profile: draft       # sandbox | draft | final

worker: {max_concurrency: 1, per_provider_concurrency: 1, heartbeat_s: 20, stale_after_s: 120,
         idle_poll_s: 0.5, job_retry_backoff_s: 30}
retry: {transient_max: 5, backoff_base_s: 2, backoff_cap_s: 60}
gates: {allow_auto_approve_in: [sandbox, draft]}
budgets:
  default_episode_cap_usd: 10.0      # benchmark Short cap
  monthly_cap_usd: 150.0
  global_cap_usd: null
  warn_pct: 80
pricing: {llm_tokens_per_char_worst_case: 0.5}   # conservative for Arabic when estimating input tokens
mock: {tts_chars_per_second: 15, video_width_16x9: 960, video_height_16x9: 540, fps: 24,
       poll_ticks: 2}
retention: {keep_raw_clips_days: 30, keep_narration_audio_days: 30}
text_pipeline: {context_token_budget: 6000, tashkeel_retry: 1, s4_after_g1: true}

# ---- Phase 3: voice + local audio engine ----
doctor: {probe_timeout_s: 30}
render: {fps: 24}          # validated: audio.sample_rate % fps == 0 (also: 25, 30). Else ConfigError.
tts:
  request_timeout_s: 120
  use_context: true             # send previous_text/next_text when the model supports it
  context_max_chars: 300
  keep_diacritics: true         # false => send diacritics-stripped text (A/B knob; see `studio tts audition`)
  qc: {min_duration_ratio: 0.4, max_duration_ratio: 2.5, auto_retries: 1}
timing:                          # merged in Phase 3
  max_stretch: 1.15
  max_hold_ms: 500
  j_cut_ms: 0                   # nonzero => ConfigError("not supported before Phase 5")
  prefer_stretch_to_save_cost: true
  estimate_drift_warn_pct: 25
  lead_in_ms: 150               # implementer default (prompt gives no value)
  line_gap_ms: 120              # implementer default (prompt gives no value)
  tail_ms: 200                  # implementer default (prompt gives no value)
  words_per_second: {ar: 2.5, en: 2.5}   # estimate; refine via `studio audio calibrate`
audio:
  sample_rate: 48000
  library_root: library
  scan_extensions: [".wav", ".mp3", ".flac", ".ogg"]
  levels:                        # starting points, calibrate by ear
    speech_line_lufs: -20
    max_line_gain_db: 9
    music_lufs: -24
    ambience_lufs: -34
    sfx_lufs: -22
    intensity_offset_db: {1: -8, 2: -5, 3: -3, 4: -1, 5: 0}
    intensity_ramp_ms: 800
  speech_trim: {threshold_db: -50, keep_ms: 60}
  music:
    fade_in_ms: 1000
    final_fade_ms: 2000
    crossfade_ms: 1500
    recent_penalty_episodes: 3
    recent_penalty: 1.0
    loop_penalty: 0.5
    segment_intensity_break: 2
  sfx: {transition_enabled: true, transition_tag: transition, transition_offset_ms: -150}
  duck:
    mode: envelope               # envelope | sidechain
    depth_db: 10
    pre_ms: 150                  # ramp-down starts this long before speech
    attack_ms: 120               # ramp-down length; MUST be <= pre_ms (validated)
    release_ms: 450
    merge_gap_ms: 700            # speech gaps shorter than this stay ducked (no pumping)
    ambience_fraction: 0.5
    sidechain: {threshold: 0.05, ratio: 8, attack_ms: 20, release_ms: 350, makeup: 1}
  master: {target_lufs: -14, true_peak_db: -1.5, lra: 11, lufs_tolerance: 1.0, tp_ceiling_db: -1.0, clip_peak_db: -0.1}
  qc: {min_duck_db: 8, min_speech_to_music_db: 10, silent_line_rms_db: -45, window_ms: 100, exclude_onset_ms: 150}

# ---- Phase 4: media (fal.ai), visual QC, prompt sanitizer ----
# Every ⚠ value is an unverified starting point calibrated by the audition/smoke runs.
fal: {queue_base_url: "https://queue.fal.run", key_env: FAL_KEY,
      request_timeout_s: 60, download_timeout_s: 120, download_retries: 3}
media:
  poll: {initial_s: 3, max_s: 15, backoff: 1.5, max_wait_s: 900}
  max_paid_attempts_per_shot: 4
  failed_job_billing: charge            # charge | free  ⚠ unverified how fal bills failed/flagged jobs
  # H5.1: media is fail-fast (a shot that exhausts QC retries fails the stage).
  # There is deliberately no circuit-breaker threshold knob: it was parsed but
  # never read. A file that still carries it loads with a DeprecationWarning.
  assumed_retry_rate: {image: 0.25, video: 0.30}
  ref_max_side_px: 1024
  ref_jpeg_quality: 90
  max_inline_bytes: 8000000
  refs_overflow: primary_only           # primary_only | fail
  chain_mode: "off"                    # last_frame raises ConfigError before Phase 5
  clip: {duration_tolerance_ms: 500, conform_crf: 14, strip_audio: true}
  qc:
    image: {min_short_side_px: 512, aspect_tolerance_pct: 2.0, min_bytes: 5000,
            min_luma_mean: 8, min_luma_stddev: 3.0, auto_retries: 2}
    video: {aspect_tolerance_pct: 2.0, min_bytes: 20000, black_fail_ratio: 0.15,
            black_pic_th: 0.98, black_min_d_s: 0.1, freeze_warn_ratio: 0.5,
            freeze_fail_ratio: 0.85, first_frame_black_luma: 8,
            first_frame_ssim_warn: 0.6, first_frame_ssim_fail: 0.0, auto_retries: 1}
character_sheets: {roles: [ref_full], aspect: "9:16"}
sanitizer: {max_levels: 2, model_key: llm.light, max_scene_chars: 600}

