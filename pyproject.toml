[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6", "pyyaml>=6.0", "python-dotenv>=1.0",
  "typer>=0.12", "httpx>=0.27", "python-ulid>=2.2", "rich>=13.7",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5",
       "mypy>=1.10", "types-PyYAML"]
providers = ["anthropic", "openai", "elevenlabs", "fal-client"]   # Phase 2+, do not import in Phase 1
ui = ["streamlit>=1.35"]                                          # Phase 6

[project.scripts]
studio = "studio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "ffmpeg: requires ffmpeg/ffprobe on PATH (auto-skipped with a clear message if absent)",
  "slow: long-running integration coverage excluded from default CI; run on demand with -m slow",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["src"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","B","UP","ASYNC","S","RUF"]
ignore = ["S101"]
# Arabic-first codebase: allow the Arabic confusables that collide with
# Latin lookalikes (alef, Arabic-Indic digit five).
allowed-confusables = ["ا", "٥"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S105", "S108", "S311", "S603", "S607", "S608", "ASYNC240"]
